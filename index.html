<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>

  <!-- 1. 카카오 지도 SDK 불러오기 (libraries=services 포함: 장소 검색용) -->
  <!-- appkey에 발급받은 JavaScript 키를 넣습니다. -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=69bdb7df46392d5e095c89aafdd696f8&libraries=services"></script>

  <style>
    /* 2. 화면 전체 초기화 및 2분할 레이아웃 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* 플렉스박스를 이용한 좌/우 2분할 구조 */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽: 검색 영역 (너비 350px) */
    .sidebar {
      width: 350px;
      height: 100%;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      padding: 16px;
      z-index: 10;
    }

    /* 검색창 박스 */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      padding: 10px 16px;
      background-color: #fee500; /* 카카오 시그니처 Yellow */
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-box button:hover {
      background-color: #fada0a;
    }

    /* 검색 결과 리스트 목록 */
    .result-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .result-item {
      padding: 12px;
      border-bottom: 1px solid #e9ecef;
      background-color: #ffffff;
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #e9ecef;
    }

    .result-item h4 {
      font-size: 15px;
      color: #333;
      margin-bottom: 4px;
    }

    .result-item p {
      font-size: 12px;
      color: #666;
    }

    /* 오른쪽: 지도 영역 (남은 공간 모두 차지) */
    .map-container {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 화면 레이아웃 컨테이너 -->
  <div class="container">
    <!-- 왼쪽 사이드바 (검색창 + 결과 리스트) -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="keywordInput" placeholder="장소를 입력하세요 (예: 강남역)" onkeydown="if(event.key==='Enter') searchPlaces()">
        <button onclick="searchPlaces()">검색</button>
      </div>
      <ul id="resultList" class="result-list">
        <!-- 검색 결과가 여기에 동적으로 들어옵니다 -->
      </ul>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div id="map" class="map-container"></div>
  </div>

  <!-- JavaScript 구현 -->
  <script>
    // 카카오맵 및 검색 서비스 변수 선언
    let map = null;
    let placeSearchService = null;
    let markers = []; // 생성된 마커들을 보관하는 배열

    // 지도가 안전하게 로드된 후 초기화 실행 (sdk 로딩 오류 방지)
    kakao.maps.load(function () {
      initMap();
    });

    // 지도 및 기능 초기화 함수
    function initMap() {
      const mapContainer = document.getElementById('map');
      
      // 기본 초기 옵션 설정 (서울시청 기준, 레벨 5)
      const defaultOptions = {
        center: new kakao.maps.LatLng(37.566826, 126.9786567),
        level: 5 // 요구사항: 지도 확대 레벨 5
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(mapContainer, defaultOptions);

      // 장소 검색 객체 생성
      placeSearchService = new kakao.maps.services.Places();

      // 현재 위치 가져오기 (Geolocation)
      getCurrentLocation();
    }

    // 브라우저의 Geolocation API를 사용하여 현재 위치 수신
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const lat = position.coords.latitude;  // 위도
            const lng = position.coords.longitude; // 경도

            const currentPosition = new kakao.maps.LatLng(lat, lng);

            // 지도의 중심을 현재 위치로 이동
            map.setCenter(currentPosition);

            // 현재 위치에 마커 표시
            const currentMarker = new kakao.maps.Marker({
              position: currentPosition,
              map: map
            });

            // 현재 위치 안내 인포윈도우
            const infowindow = new kakao.maps.InfoWindow({
              content: '<div style="padding:5px;font-size:12px;color:#333;">📍 현재 위치</div>'
            });
            infowindow.open(map, currentMarker);
          },
          function (error) {
            console.warn('위치 권한을 거부했거나 위치 정보를 가져올 수 없습니다.', error);
          }
        );
      } else {
        alert('이 브라우저에서는 위치 서비스(Geolocation)를 지원하지 않습니다.');
      }
    }

    // 키워드로 장소 검색
    function searchPlaces() {
      const keyword = document.getElementById('keywordInput').value.trim();

      if (!keyword) {
        alert('검색어를 입력해주세요!');
        return;
      }

      // 카카오 장소 검색 API 호출
      placeSearchService.keywordSearch(keyword, placesSearchCallback);
    }

    // 장소 검색 완료 시 실행되는 콜백 함수
    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 기존 마커 및 목록 삭제
        clearMarkers();
        
        const listElement = document.getElementById('resultList');
        listElement.innerHTML = '';

        const bounds = new kakao.maps.LatLngBounds();

        // 검색 결과 반복 처리
        for (let i = 0; i < data.length; i++) {
          const place = data[i];
          const placePosition = new kakao.maps.LatLng(place.y, place.x);

          // 1. 지도에 마커 추가
          const marker = new kakao.maps.Marker({
            position: placePosition,
            map: map
          });
          markers.push(marker);

          // 2. 바운드(화면 영역)에 위치 추가
          bounds.extend(placePosition);

          // 3. 왼쪽 리스트에 HTML 요소 추가
          const itemElement = document.createElement('li');
          itemElement.className = 'result-item';
          itemElement.innerHTML = `
            <h4>${place.place_name}</h4>
            <p>${place.road_address_name || place.address_name}</p>
          `;

          // 리스트 항목 클릭 시 해당 위치로 이동 및 화면 확대
          itemElement.onclick = function () {
            map.panTo(placePosition);
          };

          listElement.appendChild(itemElement);
        }

        // 검색된 장소들이 모두 보이도록 지도 범위 조정
        map.setBounds(bounds);

      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    // 이전 마커 제거 함수
    function clearMarkers() {
      for (let i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
    }
  </script>
</body>
</html>
